name: Database backup

on:
  schedule:
    # 02:17 Europe/Budapest during standard time. GitHub runs schedules in UTC.
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_BACKUP_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Create encrypted database dump
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          backup_timestamp="$(date --utc +%Y-%m-%dT%H-%M-%SZ)"
          backup_file="wikiguesser-${backup_timestamp}.dump.gpg"

          # The PostgreSQL 18 client can dump current Neon PostgreSQL versions.
          docker run --rm --env DATABASE_URL postgres:18 \
            pg_dump --format=custom --no-owner --no-privileges --file=/dev/stdout "$DATABASE_URL" > backup.dump
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" \
            --output "$backup_file" backup.dump
          rm backup.dump

          echo "file=$backup_file" >> "$GITHUB_OUTPUT"
          sha256sum "$backup_file" > "$backup_file.sha256"

      - name: Upload backup and checksum to Cloudflare R2
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp "${{ steps.backup.outputs.file }}" "s3://${R2_BUCKET}/database/${{ steps.backup.outputs.file }}" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors
          aws s3 cp "${{ steps.backup.outputs.file }}.sha256" "s3://${R2_BUCKET}/database/${{ steps.backup.outputs.file }}.sha256" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors
